services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: snapland
      POSTGRES_PASSWORD: password
      POSTGRES_DB: snapland
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapland -d snapland"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: sh -c "for i in \$(seq 1 30); do alembic upgrade head && exit 0; echo 'Waiting for database to be ready...'; sleep 2; done; exit 1"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://snapland:password@postgres:5432/snapland

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --ws-ping-interval 30 --ws-ping-timeout 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - jwt_keys:/tmp/keys
    environment:
      DATABASE_URL: postgresql+asyncpg://snapland:password@postgres:5432/snapland
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      WS_ALLOWED_ORIGINS: "*"
      JWT_KEYS_DIR: /tmp/keys
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  jwt_keys:
