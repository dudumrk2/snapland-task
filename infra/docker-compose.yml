version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: snapland
      POSTGRES_PASSWORD: password
      POSTGRES_DB: snapland
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapland -d snapland"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: sh -c "until alembic upgrade head; do echo 'Waiting for database to be ready...'; sleep 2; done"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://snapland:password@postgres:5432/snapland

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --ws-ping-interval 30 --ws-ping-timeout 10
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://snapland:password@postgres:5432/snapland
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      WS_ALLOWED_ORIGINS: "*"
      MAX_AREA_KM2: "1000.0"
      MAX_POLYGON_VERTICES: "1000"
