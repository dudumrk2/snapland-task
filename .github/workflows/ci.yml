name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: snapland
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install pytest pytest-asyncio pytest-cov httpx fakeredis ruff mypy

      - name: Run Ruff Lint
        run: |
          ruff check backend/src/

      - name: Run Mypy Type Check
        run: |
          mypy backend/src/

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/snapland
          TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/snapland
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests/ -v

  shared-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check shared types compilation
        run: |
          cd packages/shared-types
          npm ci || npm install
          npx tsc --noEmit
