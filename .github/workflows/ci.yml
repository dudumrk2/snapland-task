name: CI

on:
  pull_request:
    branches: [ main, "feat/**" ]
  push:
    branches: [ main, "feat/**" ]

jobs:
  backend:
    name: Backend Lint, Type Check & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: snapland
          POSTGRES_PASSWORD: password
          POSTGRES_DB: snapland
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapland -d snapland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e backend/
          pip install pytest pytest-asyncio pytest-cov httpx fakeredis ruff mypy

      - name: Ruff Lint Check
        run: |
          ruff check backend/src/

      - name: Mypy Type Check
        run: |
          mypy --config-file backend/pyproject.toml backend/src/

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://snapland:password@localhost:5432/snapland
        run: |
          cd backend
          alembic upgrade head

      - name: Pytest with Coverage (>= 80%)
        env:
          DATABASE_URL: postgresql+asyncpg://snapland:password@localhost:5432/snapland
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
        run: |
          pytest backend/tests/ -v --cov=snapland --cov-fail-under=80

  frontend:
    name: Frontend Type Check & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install shared types
        run: |
          cd packages/shared-types
          npm ci || npm install

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: TypeScript Check (tsc --noEmit)
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Vitest Coverage (>= 80%)
        run: |
          cd frontend
          npx vitest run --coverage

  types:
    name: Types Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run gen_types.py
        run: |
          python scripts/gen_types.py

      - name: Check for Type Drift
        run: |
          git diff --exit-code packages/shared-types

  docker-build:
    name: Docker Build All Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build All Images
        run: |
          docker compose -f infra/docker-compose.yml build

  integration-and-smoke:
    name: Composed Stack Integration & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e backend/
          pip install pytest pytest-asyncio httpx websockets

      - name: Start Composed Test Stack
        run: |
          docker compose -f infra/docker-compose.test.yml up -d --build --scale backend=2

      - name: Smoke Test (/health/ready)
        run: |
          echo "Waiting for stack to become healthy and ready..."
          timeout 60 bash -c 'until curl -s -f http://localhost/health/ready; do sleep 2; echo "waiting..."; done'
          echo "Stack is healthy and ready!"

      - name: Run Integration Tests
        run: |
          pytest backend/tests/integration/test_health_and_metrics.py backend/tests/integration/test_spatial_queries.py -v

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose -f infra/docker-compose.test.yml down -v
