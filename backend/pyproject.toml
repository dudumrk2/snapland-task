[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapland"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "geoalchemy2",
    "redis[hiredis]",
    "PyJWT[crypto]",
    "bcrypt",
    "pydantic-settings",
    "shapely",
    "pyproj",
    "orjson",
    "structlog",
    "prometheus-client",
    "apscheduler"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "fakeredis",
    "ruff",
    "mypy"
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"

