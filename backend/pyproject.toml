[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapland"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "geoalchemy2",
    "redis[hiredis]",
    "PyJWT[crypto]",
    "bcrypt",
    "pydantic-settings",
    "shapely",
    "pyproj",
    "orjson",
    "structlog",
    "prometheus-client",
    "apscheduler"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "fakeredis",
    "ruff",
    "mypy"
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/snapland"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "snapland.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "geoalchemy2.*",
    "shapely.*",
    "pyproj.*",
]
ignore_missing_imports = true


